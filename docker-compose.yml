services:
  db:
    image: postgres:16-alpine
    container_name: voicedebrief-db
    environment:
      POSTGRES_USER: voice
      # Local-only dev default; override for anything less ephemeral.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice}
      POSTGRES_DB: voicedebrief
    ports:
      # Loopback only, never expose password-authed Postgres to the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - voicedebrief_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voicedebrief"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  voicedebrief_pgdata:
