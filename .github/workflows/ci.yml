name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Home is force-dynamic, so the build needs no reachable database —
      # a dummy URL proves that stays true.
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

  db:
    # Store/mutation/reclassify integration tests against a real Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voicedebrief
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voicedebrief"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://voice:voice@localhost:5432/voicedebrief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:db
